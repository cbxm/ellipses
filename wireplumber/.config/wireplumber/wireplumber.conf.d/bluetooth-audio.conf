# Bluetooth headsets: output only. No mic, ever.
#
# History, because this has flipped twice: originally locked to A2DP, opened up
# to full duplex on 2026-08-21 when the earbuds became the call device, locked
# back down on 2026-08-24. HFP is mono and audibly worse, and the failure mode
# is invisible - a call starts, the profile flips, and music quality collapses
# with no warning. Mic duty belongs to the Focusrite 2i2 or the internal array.

monitor.bluez.properties = {
  # No hfp_*/hsp_* roles, so the headset profile is never negotiated. Cards
  # expose only off / a2dp-sink and no bluez source node ever appears.
  bluez5.roles = [ a2dp_sink, a2dp_source ]

  # "native" would handle HFP in-process; "none" means there is no HFP/HSP
  # backend at all. This is the setting doing the real work - roles alone are
  # not enough.
  bluez5.hfphsp-backend = "none"

  # Unrelated to HFP: lets headset hardware volume keys drive system volume
  # over A2DP absolute volume.
  bluez5.enable-hw-volume = true
}

wireplumber.settings = {
  # Belt and braces. With the backend disabled there is nothing to switch to,
  # but this documents the intent and survives someone re-adding the roles.
  bluetooth.autoswitch-to-headset-profile = false
}
