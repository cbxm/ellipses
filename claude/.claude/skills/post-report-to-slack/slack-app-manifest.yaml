# Create at https://api.slack.com/apps -> Create New App -> From a manifest,
# install to the workspace, /invite @Caden Devlog in #devlog, then put the
# Bot User OAuth Token (xoxb-...) in ~/.config/x2u-devlog/bot-token (chmod 600).
display_information:
  name: Caden Devlog
  description: Posts before/after reports of shipped changes to #devlog.
features:
  bot_user:
    display_name: Caden Devlog
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - files:read
      - channels:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
