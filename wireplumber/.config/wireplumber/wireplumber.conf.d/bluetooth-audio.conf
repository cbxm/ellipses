# Bluetooth headsets: full duplex (A2DP for playback, HFP for mic).
#
# Previously this file did the opposite - it stripped the roles down to
# a2dp_sink/a2dp_source and set hfphsp-backend="none" so the mic could never be
# offered. That was deliberate: any app opening a mic would drag the headset out
# of stereo A2DP into mono HFP. Re-enabled 2026-08-21 now that the earbuds are
# the primary call device and the mic is wanted.

monitor.bluez.properties = {
  # hfp_ag / hsp_ag = we act as the Audio Gateway, the headset is the hands-free
  # unit. (hfp_hf / hsp_hf are the reverse - for connecting TO a phone.)
  bluez5.roles = [ a2dp_sink, a2dp_source, hfp_ag, hfp_hf, hsp_ag, hsp_hs ]

  # "native" = handle HFP in-process. The alternative, "ofono", needs a modem
  # stack we do not run. "none" disables the mic entirely (the old behaviour).
  bluez5.hfphsp-backend = "native"

  # mSBC is wideband (16kHz) vs CVSD's 8kHz telephone quality. HFP is still a
  # big step down from A2DP, but mSBC makes it tolerable for calls.
  bluez5.enable-msbc = true

  # Let headset hardware volume keys drive the system volume.
  bluez5.enable-hw-volume = true
}

wireplumber.settings = {
  # Switch to headset profile when an app captures from the headset's mic.
  #
  # This does NOT fire merely because some app opened a mic. The autoswitch
  # script (device/autoswitch-bluetooth-profile.lua, checkStreamStatus) resolves
  # the capture stream's peer and only switches if that peer is the bluetooth
  # loopback source. Capture from the Focusrite or the internal array and the
  # headset stays in A2DP.
  #
  # Practical consequence: the headset mic outranks the internal array (see
  # 50-default-priorities.conf), so with the Focusrite unplugged the earbuds
  # become the default mic and calls WILL drop to HFP. Keep the 2i2 connected to
  # stay in stereo, or set this false to never switch.
  bluetooth.autoswitch-to-headset-profile = true
}
