# === PREFIX ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === GENERAL ===
set -g mouse on                      # Enable mouse

# === MOUSE SCROLL SPEED ===
# Scroll 1 line at a time (default is 5)
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
set -g base-index 1                  # Start windows at 1
setw -g pane-base-index 1            # Start panes at 1
set -g renumber-windows on           # Renumber windows when one is closed
set -g history-limit 50000           # More scrollback
set -sg escape-time 10               # Faster escape (for vim)
set -g focus-events on               # Focus events for vim autoread
set -g repeat-time 1500              # Repeat timeout for -r bindings

# === COLORS ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# === SPLITS ===
bind u split-window -v -c "#{pane_current_path}"
bind i split-window -h -c "#{pane_current_path}"
bind C-u split-window -v -c "#{pane_current_path}"
bind C-i split-window -h -c "#{pane_current_path}"

# === WINDOWS ===
bind w new-window
bind n previous-window
bind m next-window
bind C-w new-window
bind -r C-n previous-window
bind -r C-m next-window

# === PANE NAVIGATION (vim-style) ===
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# === PANE RESIZING ===
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === EASY RELOAD ===
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# === VI COPY MODE + CLIPBOARD ===
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
unbind -T copy-mode-vi MouseDragEnd1Pane   # Don't auto-copy on mouse release
bind -T copy-mode-vi DoubleClick1Pane send -X select-word   # Select word, don't copy
bind -T copy-mode-vi TripleClick1Pane send -X select-line   # Select line, don't copy
bind -T root DoubleClick1Pane select-pane -t = \; copy-mode \; send -X select-word
bind -T root TripleClick1Pane select-pane -t = \; copy-mode \; send -X select-line

# === SESSIONS ===
bind M-s command-prompt -p "New session:" "new-session -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# === QUICK NAVIGATION ===
bind Tab last-window                  # Toggle last window
bind C-Tab last-window
bind BSpace switch-client -l          # Toggle last session

# === POPUP TERMINAL ===
bind p if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'popup -E -w 80% -h 80% "tmux new -A -s popup"'

# === UTILITY ===
bind S setw synchronize-panes         # Sync panes toggle
bind B break-pane                     # Break pane to new window
bind J choose-window "join-pane -h -s '%%'"  # Join pane from another window
bind < swap-window -t -1 \; previous-window  # Swap window left
bind > swap-window -t +1 \; next-window      # Swap window right

# === PANE MENU (prefix + C-p) ===
bind C-p switch-client -T pane-menu
bind -T pane-menu m choose-window "join-pane -h -t '%%'"
bind -T pane-menu b break-pane -d
bind -T pane-menu e select-layout even-horizontal
bind -T pane-menu E select-layout main-vertical
bind -T pane-menu j swap-pane -D
bind -T pane-menu k swap-pane -U
bind -T pane-menu Escape switch-client -T root

# === WINDOW MENU (prefix + C-w) ===
bind C-w switch-client -T window-menu
bind -T window-menu m choose-tree -s "move-window -t '%%'"
bind -T window-menu l choose-tree -s "link-window -t '%%'"
bind -T window-menu u unlink-window
bind -T window-menu Escape switch-client -T root

# === KANAGAWA DRAGON THEME ===
# Colors
bg="#181616"
fg="#c5c9c5"
accent="#8ba4b0"
yellow="#c4b28a"
green="#8a9a7b"
red="#c4746e"
muted="#625e5a"

# Status bar
set -g status-position top
set -g status-style "bg=#1d1c19 fg=$fg"
set -g status-left ""
set -g status-right ""
set -g status-left-length 100
set -g status-right-length 100

# Status format with centered date/time
set -g status-format[0] "\
#[align=left,bg=#1d1c19]\
#{?client_prefix,#[fg=#181616 bg=#c4b28a] PREFIX #[bg=#1d1c19] ,}\
#{?window_zoomed_flag,#[fg=#181616 bg=#c4b28a] ZOOM #[bg=#1d1c19] ,}\
#{?pane_synchronized,#[fg=#c4746e] SYNC #[default],}\
#[fg=#8ba4b0,bold][#S]#[default] \
#{W:#[range=window|#{window_index}]#{?window_active,#[fg=#181616#,bold#,bg=#8ba4b0] #I:#W #[nobold#,bg=#1d1c19],#[fg=#a6a69c#,bg=#1d1c19] #I:#W }#[norange]}\
#[align=centre,bg=#1d1c19]\
#(~/.config/tmux/scripts/copy-mode-bar)\
#[align=right,bg=#1d1c19]\
#[fg=#c5c9c5]#(git -C #{pane_current_path} symbolic-ref --short HEAD 2>/dev/null) \
#(~/.config/tmux/scripts/cpu)\
#(~/.config/tmux/scripts/mem)\
#(~/.config/tmux/scripts/bat)#[bg=#1d1c19]  #(~/.config/tmux/scripts/datetime)"

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-indicators off
set -g pane-border-style "fg=$muted"
set -g pane-active-border-style "fg=$accent"
set-hook -g pane-mode-changed 'if-shell -F "#{pane_in_mode}" "set -g pane-active-border-style fg=#c4746e" "set -g pane-active-border-style fg=#8ba4b0"'

# Message style
set -g message-style "bg=$bg fg=$yellow"

# === PLUGINS ===
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'Morantron/tmux-fingers'         # Quick copy with hints

# Plugin settings
set -g @continuum-restore 'on'                  # Auto-restore on tmux start
set -g @fingers-key f                           # Use prefix+f for fingers
unbind f                                        # Remove default find-window

# Fingers styling (Kanagawa Dragon)
set -g @fingers-hint-style "fg=black,bg=blue,bold"
set -g @fingers-highlight-style "fg=blue,bold"
set -g @fingers-selected-hint-style "fg=black,bg=yellow,bold"
set -g @fingers-selected-highlight-style "fg=black,bg=blue,bold"

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
