# Create at https://api.slack.com/apps -> Create New App -> From a manifest,
# install to the workspace, /invite @Caden's Bot in #devlog and #dev, then put the
# Bot User OAuth Token (xoxb-...) in ~/.config/x2u-devlog/bot-token (chmod 600).
display_information:
  name: Caden's Bot
  description: "Posts before/after reports of shipped changes to #devlog, and Claude's questions for Rob to #dev."
features:
  bot_user:
    display_name: Caden's Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - files:read
      - channels:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
