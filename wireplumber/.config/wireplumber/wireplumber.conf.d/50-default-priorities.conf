# Device selection priorities. Higher wins.
#
# These only break ties between *candidates*. A user-pinned default stored as
# default.configured.audio.sink in ~/.local/state/wireplumber/default-nodes
# overrides priority entirely - if a connected device still refuses to become
# the default, inspect that file, and repoint it with `wpctl set-default <id>`
# rather than editing it by hand.

# Outputs:  bluetooth 2000 > Focusrite 1500 > HDMI 1200 > internal 1000
# Inputs:   Focusrite 2500 > internal 2000 > StreamCam 500
#
# No bluetooth mic in that list: HFP is disabled outright in
# bluetooth-audio.conf, so no bluez source node exists to rank.

monitor.alsa.rules = [
  # --- outputs ---
  { matches = [ { node.name = "alsa_output.usb-Focusrite_Scarlett_2i2_USB-00.analog-stereo" } ]
    actions = { update-props = { priority.session = 1500 } } }
  { matches = [ { node.name = "alsa_output.pci-0000_73_00.1.hdmi-stereo" } ]
    actions = { update-props = { priority.session = 1200 } } }
  { matches = [ { node.name = "alsa_output.pci-0000_73_00.1.hdmi-stereo-extra1" } ]
    actions = { update-props = { priority.session = 1200 } } }
  { matches = [ { node.name = "alsa_output.pci-0000_73_00.6.analog-stereo" } ]
    actions = { update-props = { priority.session = 1000 } } }

  # --- inputs ---
  { matches = [ { node.name = "alsa_input.usb-Focusrite_Scarlett_2i2_USB-00.analog-stereo" } ]
    actions = { update-props = { priority.session = 2500 } } }
  { matches = [ { node.name = "alsa_input.pci-0000_73_00.6.analog-stereo" } ]
    actions = { update-props = { priority.session = 2000 } } }
  # StreamCam mic deliberately last: it exists so the webcam does not silently
  # become the default mic when plugged in.
  { matches = [ { node.name = "alsa_input.usb-046d_Logitech_StreamCam_1519A455-02.analog-stereo" } ]
    actions = { update-props = { priority.session = 500 } } }
]

# Matched by pattern, not MAC. Per-device rules meant every new pair of earbuds
# silently landed at the default ~1010 and lost to HDMI until someone noticed.
monitor.bluez.rules = [
  { matches = [ { node.name = "~bluez_output..*" } ]
    actions = { update-props = { priority.session = 2000 } } }
]

# No rule for bluez SOURCES, and there is no point adding one if HFP is ever
# re-enabled: that mic is a loopback node built with LocalModule
# (scripts/monitors/bluez.lua:130) and never passes through monitor.bluez.rules,
# so a rule there matches nothing and fails silently. Its priority is hardcoded
# to 2010 (same file, :283) - above the internal array at 2000 - which is why
# turning HFP back on makes the earbuds the default mic on their own.
